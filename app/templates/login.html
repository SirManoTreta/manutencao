{% extends "base.html" %}
{% block content %}
<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-badge">TI</div>
      <div>
        <strong>Manutenção</strong>
        <span>Visual inspirado no protótipo PO UI</span>
      </div>
    </div>
    <div class="page-header mb-4">
      <div>
        <h1>Login</h1>
        <p>Acesso local ao painel de manutenção.</p>
      </div>
    </div>
    {% if error %}<div class="alert alert-danger mb-3">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <div class="mb-3"><label class="form-label">Usuário</label><input class="form-control" name="username" required></div>
      <div class="mb-3"><label class="form-label">Senha</label><input class="form-control" type="password" name="password" required></div>
      <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
    <div class="text-muted mt-3 small">Se for a primeira vez, abra <code>/setup</code> para criar o admin.</div>
  </div>
</div>
{% endblock %}
